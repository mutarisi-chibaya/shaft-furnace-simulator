name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,uq,app,demo]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check src tests scripts app
      - name: Mypy
        run: mypy
      # references/ (the downloaded papers) is not in the repository, so the provenance
      # tests that need the PDF text layers are skipped here; they run locally after
      # scripts/fetch_references.py.
      - name: Pytest
        run: pytest -q
