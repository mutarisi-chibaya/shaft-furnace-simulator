# Uncertain inputs for Milestone 6 (uncertainty quantification), case A whole furnace.
#
# Same conventions as data/kinetics.yaml: value (SI), unit, source (key in data/SOURCES.md);
# `quote` + `as_written` + `factor` when the number is in the PDF text layer (checked by
# tests/test_provenance.py). Only parameters with a citable range or a data-derived spread
# are included; see docs/validation.md (Milestone 6) for what is left out and why.

kinetics:
  # The six kinetic parameters (ln k_j at T_ref = 1023.15 K, Ea_j) of the three reduction
  # steps, multivariate normal around the refit of Milestone 2 (data/kinetics_refit.yaml,
  # generated by scripts/fit_kinetics.py from the digitised TGA curves of Marsigny 2025,
  # Fig. 6). Covariance: the jackknife over the seven temperature curves (leave one curve
  # out), which captures curve-to-curve scatter; the Jacobian covariance treats the 40 points
  # of a curve as independent and is reported for comparison only. Sampled through the
  # principal components (independent standard normals), truncated at +/- 3 sigma.
  covariance: {value: jackknife_covariance, unit: "-", source: Marsigny2025-Fig6-refit,
               note: "key in data/kinetics_refit.yaml"}
  truncation_sigma: {value: 3.0, unit: "-", source: numerical-choice,
                     note: "keeps extreme quantiles of the Gaussian out of the Sobol design"}

tortuosity:
  # Pellet pore tortuosity; nominal 2 (data/kinetics.yaml). Uniform between the bounds.
  low: {value: 1.0, unit: "-", source: Marsigny2025-S3.5.3, ref_file: marsigny2025_metals15_1034.txt,
        quote: "Physically, tortuosity should be in the range of 1", as_written: "1", factor: 1.0}
  high: {value: 3.0, unit: "-", source: Marsigny2025-S3.5.3, ref_file: marsigny2025_metals15_1034.txt,
         quote: "3 [34]; hence, we chose a moderate value of 2", as_written: "3", factor: 1.0,
         note: "the kinetic constants were fitted with tortuosity 2, so varying it alone
                overstates its effect (the fit would partly compensate)"}

transfer_correlation:
  # Gas-solid heat and mass transfer: linear blend lambda in [0, 1] between the packed-bed
  # correlation of Wakao and Kaguei (lambda = 0, nominal; Wagner 2008) and the single-sphere
  # correlation of Ranz and Marshall (lambda = 1; Marsigny 2025 thesis, eq. 12), both already
  # in data/transport.yaml. No published accuracy figure for Wakao-Kaguei could be found; the
  # spread between the two published choices is used instead (RM gives 0.3-0.5 x WK here).
  low: {value: 0.0, unit: "-", source: Wagner2008-III.5.3, note: "Wakao-Kaguei"}
  high: {value: 1.0, unit: "-", source: Marsigny2025-thesis-eq12, note: "Ranz-Marshall"}
