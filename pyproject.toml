[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shaftsim"
version = "0.1.0"
description = "Physics-based 1D simulator of a hydrogen direct-reduction shaft furnace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18"]
uq = ["SALib>=1.4"]
notebook = ["nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.25"]
# screenshots and the demo video (scripts/capture_app_screenshots.py, record_demo.py); uses a
# local Chrome through Playwright's "chrome" channel, so no browser download is needed
demo = ["playwright>=1.40"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pandas-stubs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "NPY", "RUF"]
# Physics symbols (T, Cp, T_min, ...) are kept upper-case on purpose; scientific text uses
# en dashes, Greek letters and degree signs (RUF001-003).
ignore = ["N802", "N803", "N806", "N815", "N816", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# notebooks import the scripts/ helpers after adding scripts/ to sys.path
"notebooks/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["scipy.*", "SALib.*"]
ignore_missing_imports = true
